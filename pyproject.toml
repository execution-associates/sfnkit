[project]
name = "sfnkit"
version = "0.1.0"
description = "Author AWS Step Functions workflows as decorated Python functions"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Execution Associates" }]
keywords = ["aws", "step-functions", "lambda", "workflow", "orchestration", "serverless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["boto3>=1.35"]

[project.urls]
Homepage = "https://github.com/execution-associates/sfnkit"
Repository = "https://github.com/execution-associates/sfnkit"
Issues = "https://github.com/execution-associates/sfnkit/issues"

[project.scripts]
sfnkit = "sfnkit.cli:main"

[project.entry-points."sfnkit.compute"]
lambda = "sfnkit.compute.lambda_:LambdaBackend"

[dependency-groups]
dev = ["pytest>=8", "moto[s3]>=5", "cfn-lint>=1", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfnkit"]

[tool.pytest.ini_options]
markers = [
    "aws: calls real AWS APIs but creates no resources",
    "e2e: deploys real resources to AWS and tears them down",
]
addopts = "-m 'not aws and not e2e'"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "E731", "B905"]

[tool.ruff.lint.per-file-ignores]
# match/case captures in example workflows are part of the pattern being demonstrated
"tests/core/flows.py" = ["F841"]
"examples/*.py" = ["F841"]
